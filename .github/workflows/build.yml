name: Flutter Build APK & EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable

      - name: Create full Flutter project structure
        run: |
          # Generate full project scaffolding with flutter create
          flutter create --project-name hello_world --org com.example --platforms android .
          # Overwrite main.dart with our custom code
          cp lib/main.dart /tmp/our_main.dart
          git checkout lib/main.dart
          cp /tmp/our_main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.x
          channel: stable

      - name: Create full Flutter project structure
        shell: pwsh
        run: |
          # Generate full project scaffolding with flutter create
          flutter create --project-name hello_world --org com.example --platforms windows .
          # Overwrite main.dart with our custom code
          Copy-Item lib/main.dart -Destination C:\temp_our_main.dart
          git checkout lib/main.dart
          Copy-Item C:\temp_our_main.dart -Destination lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows
          path: build/windows/x64/runner/Release/
